[package]
name = "rust_web_server"
version = "0.1.0"
authors = ["Belchior Oliveira <belchior@outlook.com>"]
edition = "2024"
rust-version = "1.91"

[dependencies]
actix-cors = "0.7.1"
actix-service = "2.0.3"
actix-web = "4.12.1"
base64 = "0.13.0"
deadpool-postgres = "0.14.1"
dotenvy = "0.15.7"
futures = "0.3.31"
futures-util = "0.3.31"
serde = { version = "1.0.144", features = ["derive"] }
sql_query_builder = { version = "2.5.2", features = ["postgresql"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full", "tracing"] }
tokio-postgres = "0.7.15"
tokio-stream = "0.1.17"

# used to create trancing and logs
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-actix-web = { version = "0.7.19" }

[dev-dependencies]
actix-rt = "2.11.0"
pretty_assertions = "1.4.1"
rand = "0.9.2"
